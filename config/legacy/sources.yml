# Sources for the daily report. Every entry declares purpose, access (type/url), update
# frequency, reliability, limitations and failure behavior (constitution: Extensibility).
# Tiers: 1 primary · 2 technical analysis · 3 discovery/community · 4 learning resource.
# Validate with: npm run fp -- sources check

sources:
  # ---------------------------------------------------------------- frontend (official)
  - id: react-blog
    name: React Blog
    type: rss
    url: https://react.dev/rss.xml
    tier: 1
    domains: [ frontend ]
    purpose: Official React releases, RFC outcomes and deprecations
    updateFrequency: monthly
    reliability: primary, authoritative
    limitations: patch releases are not always announced
    failureBehavior: mark unavailable, continue

  - id: nextjs-blog
    name: Next.js Blog
    type: rss
    url: https://nextjs.org/feed.xml
    tier: 1
    domains: [ frontend ]
    purpose: Official Next.js releases and feature announcements
    updateFrequency: monthly
    reliability: primary, authoritative (vendor)
    limitations: performance claims are vendor-reported
    failureBehavior: mark unavailable, continue

  - id: vue-blog
    name: The Vue Point
    type: rss
    url: https://blog.vuejs.org/feed.rss
    tier: 1
    domains: [ frontend ]
    purpose: Official Vue releases and roadmap
    updateFrequency: monthly
    reliability: primary, authoritative
    limitations: low volume
    failureBehavior: mark unavailable, continue

  - id: angular-blog
    name: Angular Blog
    type: rss
    url: https://blog.angular.dev/feed
    tier: 1
    domains: [ frontend ]
    purpose: Official Angular releases and features
    updateFrequency: monthly
    reliability: primary, authoritative
    limitations: hosted on Medium; feed may truncate content
    failureBehavior: mark unavailable, continue

  - id: svelte-blog
    name: Svelte Blog
    type: rss
    url: https://svelte.dev/blog/rss.xml
    tier: 1
    domains: [ frontend ]
    purpose: Official Svelte and SvelteKit releases
    updateFrequency: monthly
    reliability: primary, authoritative
    limitations: monthly digest posts bundle many changes
    failureBehavior: mark unavailable, continue

  - id: typescript-blog
    name: TypeScript Blog
    type: rss
    url: https://devblogs.microsoft.com/typescript/feed/
    tier: 1
    domains: [ frontend ]
    purpose: Official TypeScript betas, RCs and releases
    updateFrequency: every few weeks
    reliability: primary, authoritative
    limitations: none known
    failureBehavior: mark unavailable, continue

  - id: chrome-developers
    name: Chrome for Developers Blog
    type: rss
    url: https://developer.chrome.com/static/blog/feed.xml
    tier: 1
    domains: [ frontend ]
    purpose: New web platform features shipping in Chrome
    updateFrequency: weekly
    reliability: primary, authoritative (single browser vendor)
    limitations: Chrome-specific; cross-browser support must be checked separately
    failureBehavior: mark unavailable, continue

  - id: mozilla-hacks
    name: Mozilla Hacks
    type: rss
    url: https://hacks.mozilla.org/feed/
    tier: 1
    domains: [ frontend ]
    purpose: Firefox platform features and web standards work
    updateFrequency: monthly
    reliability: primary, authoritative
    limitations: low volume
    failureBehavior: mark unavailable, continue

  - id: webkit-blog
    name: WebKit Blog
    type: rss
    url: https://webkit.org/feed/
    tier: 1
    domains: [ frontend ]
    purpose: Safari and WebKit feature releases
    updateFrequency: monthly
    reliability: primary, authoritative
    limitations: release notes are long; key changes must be extracted
    failureBehavior: mark unavailable, continue

  - id: nodejs-blog
    name: Node.js Blog
    type: rss
    url: https://nodejs.org/en/feed/blog.xml
    tier: 1
    domains: [ frontend, security ]
    purpose: Node.js releases and security releases
    updateFrequency: weekly
    reliability: primary, authoritative
    limitations: many routine patch releases
    failureBehavior: mark unavailable, continue

  # ---------------------------------------------------------------- security
  - id: npm-advisories
    name: GitHub Advisory Database (npm)
    type: github-advisories
    url: https://api.github.com/advisories
    tier: 1
    domains: [ security, frontend ]
    params:
      ecosystem: npm
      severity: [ high, critical ]
    purpose: High and critical vulnerabilities in the npm ecosystem
    updateFrequency: continuous
    reliability: primary, curated
    limitations: 60 requests/hour without GITHUB_TOKEN
    failureBehavior: mark unavailable, continue

  - id: chrome-releases
    name: Chrome Releases
    type: rss
    url: https://chromereleases.googleblog.com/feeds/posts/default
    tier: 1
    domains: [ security, frontend ]
    purpose: Chrome stable updates including security fixes
    updateFrequency: weekly
    reliability: primary, authoritative
    limitations: very frequent routine updates; only notable fixes are relevant
    failureBehavior: mark unavailable, continue

  - id: owasp-news
    name: OWASP News
    type: web
    url: https://owasp.org/news/
    tier: 1
    domains: [ security ]
    purpose: OWASP project announcements (Top 10, ASVS, cheat sheets)
    updateFrequency: monthly
    reliability: primary for OWASP projects
    limitations: no feed; visited by the skill
    failureBehavior: skip visit, note unavailable

