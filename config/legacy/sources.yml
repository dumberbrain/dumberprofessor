    updateFrequency: several per week
    reliability: established technical source
    limitations: high volume; partner posts are promotional
    failureBehavior: mark unavailable, continue

  - id: simon-willison
    name: Simon Willison's Weblog
    type: rss
    url: https://simonwillison.net/atom/everything/
    tier: 2
    domains: [ ai-llm, security ]
