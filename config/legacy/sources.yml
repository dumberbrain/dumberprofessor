  # ---------------------------------------------------------------- discovery
  - id: hacker-news
    name: Hacker News
    type: hn
    url: https://hn.algolia.com/api/v1/search_by_date
    tier: 3
    domains: [ frontend, system-design, security, ai-llm ]
    params:
      minPoints: 100
    purpose: Discover widely discussed developments
    updateFrequency: continuous
    reliability: discovery only; never sole evidence (FR-005)
    limitations: popularity is not technical merit; many off-topic stories
    failureBehavior: mark unavailable, continue

  - id: github-trending
    name: GitHub Trending
    type: web
    url: https://github.com/trending?since=daily
    tier: 3
    domains: [ frontend, ai-llm ]
    purpose: Discover fast-rising repositories
    updateFrequency: daily
    reliability: discovery only; stars are not quality evidence
    limitations: no API; visited by the skill
    failureBehavior: skip visit, note unavailable

  - id: javascript-weekly
    name: JavaScript Weekly
    type: rss
    url: https://cprss.s3.amazonaws.com/javascriptweekly.com.xml
