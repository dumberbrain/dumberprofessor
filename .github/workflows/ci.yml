# Same sweep as the pre-push hook (.husky/pre-push), on a clean install.
# CI is the authority; the hooks are a faster local echo of it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # Documents reader (apps/reader): production build, Playwright E2E with axe, dependency audit.
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx -w apps/reader playwright install --with-deps chromium
      - name: Build and E2E (Playwright + axe)
        run: npm run test:e2e -w apps/reader
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/reader/playwright-report
          retention-days: 7
